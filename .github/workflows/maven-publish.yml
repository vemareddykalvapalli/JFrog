name: ReactNative-CICD

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout Code
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2️⃣ Setup Node
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # 3️⃣ Install Dependencies
    - name: Install Dependencies
      run: npm install

    # 4️⃣ Build React Native Web (or production build)
    - name: Build Project
      run: |
        npm run build
        zip -r app-build.zip build/

    # 5️⃣ Upload Artifact to JFrog
    - name: Upload to JFrog Artifactory
      run: |
        curl -u ${{ secrets.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }} \
        -T app-build.zip \
        "${{ secrets.JFROG_URL }}/Adminblissierra/app-build.zip"

    # 6️⃣ Copy Artifact to EC2
    - name: Copy Artifact to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "app-build.zip"
        target: "/home/ubuntu/"

    # 7️⃣ Deploy to Tomcat on EC2
    - name: Deploy to Tomcat
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo apt update -y
          sudo apt install openjdk-11-jdk -y
          sudo apt install tomcat9 -y
          sudo systemctl start tomcat9
          sudo unzip -o /home/ubuntu/app-build.zip -d /var/lib/tomcat9/webapps/ROOT
          sudo systemctl restart tomcat9
